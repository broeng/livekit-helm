# Default values for livekit/sip.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: livekit/sip
  pullPolicy: IfNotPresent

imagePullSecrets: []

terminationGracePeriodSeconds: 18000

# configuration for livekit
# you may specify any config settings that are valid in livekit-sip's
# config.yaml: https://github.com/livekit/livekit/blob/master/config-sample.yaml
livekit:
  log_level: info
  sip_port: 5060
  sip_port_listen:
  tls:
    {}
    # port:
    # port_listen:
    # certs:
    #   - cert_file: tlscert
    #     key_file: tlskey
    ## min TLS version, accepts: "tls1.0", "tls1.1", "tls1.2", "tls1.3"
    # min_version:
    ## max TLS version, accepts: "tls1.0", "tls1.1", "tls1.2", "tls1.3"
    # max_version:
    ## optional list (list of strings) of cipher suite names.
    ## Note: Only applies to TLS 1.0-1.2; TLS 1.3 cipher suites are not configurable.
    # cipher_suites:
  rtp_port: 10000-20000
  # Livekit server api key name.
  # Prefer using an existing secret, with the section secrets below, or
  # the environment variables LIVEKIT_API_KEY and LIVEKIT_API_SECRET instead.
  # api_key: ""
  # api_secret: ""
  # Livekit server WebSocket URL
  ws_url: ""
  redis:
    {}
    # Must be the same as used by your livekit server
    # address:
    # db: 0
    # username:
    # password:
  # Health check port. Needed for pod liveness and readiness monitoring.
  health_port: 8081
  prometheus_port: 8082

secrets:
  api:
    enabled: false
    existingSecret: ""
    apiSecretPropertyName: "secret"
  tlscert:
    enabled: false
    existingSecret: ""
    certPropertyName: "tls.crt"
    keyPropertyName: "tls.key"

# Extra environment variables for the LiveKit SIP container.
extraEnv: []

nameOverride: ""
fullnameOverride: ""

loadBalancer:
  type: disable
  servicePort: 5060
  annotations: {}
  extraConfig: {}

ingress:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  # targetMemoryUtilizationPercentage: 80

# if LiveKit should run only on specific nodes
# this can be used to isolate designated nodes
nodeSelector:
  {}
  # node.kubernetes.io/instance-type: c5.2xlarge

resources:
  {}
  # Due to port restrictions, you can run only one instance of LiveKit per physical
  # node. Because of that, we recommend giving it plenty of resources to work with
  # limits:
  #   cpu: 6000m
  #   memory: 2048Mi
  # requests:
  #   cpu: 4000m
  #   memory: 1024Mi

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podHostNetwork: true

podAnnotations:
  sidecar.istio.io/inject: "false"
  linkerd.io/inject: disabled

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

tolerations: []

affinity: {}

# https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.27/#deploymentstrategy-v1-apps
deploymentStrategy: {}

deploymentAnnotations: {}

# Specifies configuration gke backendconfig
gcp:
  backendConfig:
    # 10h timeout for websocket
    timeoutSec: 36000
    connectionDraining:
      drainingTimeoutSec: 60

serviceMonitor:
  # Specifies whether a service monitor should be created
  create: false
  # Annotations to add to the service monitor
  annotations: {}
  # The name of the service monitor to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # The scrape interval
  interval: 30s
